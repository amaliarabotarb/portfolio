<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amalia Akhmedova — Portfolio</title>

  <style>
    body {
      margin: 0;
      background: #f7f4ed;
      color: #071a33;
      font-family: Arial, sans-serif;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(54px, 9vw, 140px);
      font-weight: 400;
      letter-spacing: 4px;
    }

    .gold {
      color: #b9924a;
    }

    p {
      margin-top: 24px;
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .button {
      display: inline-block;
      margin-top: 40px;
      padding: 16px 34px;
      border: 1px solid #b9924a;
      color: #071a33;
      text-decoration: none;
      transition: .3s;
    }

    .button:hover {
      background: #071a33;
      color: white;
    }
  </style>
</head>

<body>

<section class="hero">
  <div>
    <h1>
      AMALIA<br>
      <span class="gold">AKHMEDOVA</span>
    </h1>

    <p>
      Graphic Designer & Web Developer ✦ UI/UX Specialist ✦ Future Dentist
    </p>

    <a class="button" href="#portfolio">
      Смотреть работы
    </a>
  </div>
</section>

</body>
</html>
